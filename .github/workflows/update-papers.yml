name: Update PubMed papers

on:
  # Optional manual "Run workflow" button in the Actions tab. Not required day-to-day —
  # the site itself checks PubMed live on every page view — this just refreshes the
  # permanent backup stored in data/*.json on demand.
  workflow_dispatch: {}
  # Daily backup run: 18:00 UTC = 03:00 KST. This persists whatever the live client-side
  # check has been finding into the repo, so the archive stays complete/searchable even
  # for a visitor whose browser can't reach PubMed directly (network policy, ad blocker, etc).
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        run: python3 scripts/update_papers.py

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No changes to commit."
          else
            git add data/
            git commit -m "chore: update paper archive data [automated]"
            git push
          fi
