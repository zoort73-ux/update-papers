name: Update PubMed papers

on:
  # Manual "Run workflow" button in the Actions tab — this is the refresh button.
  workflow_dispatch: {}
  # Automatic monthly run: 00:00 UTC on the 1st = 09:00 KST.
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        run: python3 scripts/update_papers.py

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No changes to commit."
          else
            git add data/
            git commit -m "chore: update paper archive data [automated]"
            git push
          fi
